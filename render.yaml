services:
  - type: web
    name: tmv
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /vlc-status
    envVars:
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: STREAM_HOST
        sync: false                     # fill in the Render URL after first deploy
      - key: TAMILMV_BASES
        value: https://www.1tamilmv.ceo
      - key: TORRENT_PATH
        value: /tmp/torrents
      - key: MAX_ACTIVE_TORRENTS
        value: "3"
      - key: TORRENT_IDLE_TTL_MS
        value: "120000"
      - key: MAX_STREAM_FILE_BYTES
        value: "5368709120"
      - key: MAX_MAGNETS_PER_TOPIC
        value: "50"
